<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173451">
<title>우리 도장 대회 관리</title>
<style>
:root{--navy:#173451;--blue:#2563eb;--bg:#f4f7fb;--line:#dbe3ed;--muted:#64748b;--green:#15803d;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#172033}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 15px;font-weight:700;background:var(--blue);color:white}button.secondary{background:#e8eef6;color:#173451}button.danger{background:#fee2e2;color:#991b1b}button.small{padding:7px 10px;font-size:13px}.wrap{max-width:1000px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#173451,#24517b);color:white;border-radius:20px;padding:22px;margin-bottom:16px}.hero h1{margin:5px 0 8px;font-size:24px}.hero p{margin:0;color:#dbeafe}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.nav button{background:white;color:#334155;border:1px solid var(--line)}.nav button.active{background:var(--navy);color:white}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 12px #102b4b08}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field label{font-size:14px;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:12px;background:white;color:#172033}.muted{color:var(--muted);font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.event{display:block;border:1px solid var(--line);border-radius:14px;padding:14px;background:white;color:#172033;text-align:left;width:100%;margin:9px 0}.event.selected{border:2px solid var(--blue);background:#eff6ff}.pill{display:inline-block;border-radius:99px;padding:4px 9px;background:#e8eef6;font-size:12px}.pill.green{background:#dcfce7;color:#166534}.pill.orange{background:#ffedd5;color:#9a3412}.total{font-size:26px;font-weight:800;color:var(--navy)}.hidden{display:none!important}.checkline{display:flex;gap:9px;align-items:flex-start;margin:12px 0;font-size:14px}.checkline input{margin-top:4px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{background:#f8fafc}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stat{background:#f1f5f9;border-radius:12px;padding:12px}.stat strong{display:block;font-size:22px}.notice{padding:12px;border-radius:12px;background:#eff6ff;color:#1e40af;font-size:13px}.dangertext{color:var(--red)}.footer{font-size:12px;color:var(--muted);text-align:center;padding:20px}
@media(max-width:600px){.wrap{padding:10px}.hero{padding:18px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.row.mobilecol{align-items:flex-start;flex-direction:column}.hero h1{font-size:21px}}
</style></head>
<body><main class="wrap">
<header class="hero"><div style="font-size:12px;letter-spacing:1px;color:#bfdbfe">DOJANG MANAGEMENT</div><h1>우리 도장 대회 관리</h1><p>대회 신청 · 참가비 확인 · 국기원 최초 1품 접수 준비</p></header>
<div class="nav">
<button id="navParent" class="active" onclick="showView('parent')">학부모 신청</button>
<button id="navAdmin" onclick="showView('admin')">관리자</button>
</div>
<section id="parentView"></section>
<section id="adminView" class="hidden"></section>
<div class="footer">초기 실행 버전 · 현재 데이터는 이 브라우저에 저장됩니다.</div>
</main>
<script>
const KEY='tkd-manager-v1';
const defaultData={settings:{dojo:'우리 도장',bank:'은행명 입력',account:'계좌번호 입력',holder:'예금주 입력'},events:[],athletes:[],applications:[]};
let data=load();
function load(){try{return {...structuredClone(defaultData),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return structuredClone(defaultData)}}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function won(n){return Number(n||0).toLocaleString('ko-KR')+'원'}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function showView(v){document.getElementById('parentView').classList.toggle('hidden',v!=='parent');document.getElementById('adminView').classList.toggle('hidden',v!=='admin');document.getElementById('navParent').classList.toggle('active',v==='parent');document.getElementById('navAdmin').classList.toggle('active',v==='admin');if(v==='parent')renderParent();else renderAdmin()}
function renderParent(){const el=document.getElementById('parentView');const open=data.events.filter(e=>e.open);el.innerHTML=`
<div class="card"><h2>참가 신청할 항목 선택</h2><p class="muted">대회마다 신청서를 따로 작성합니다. 국기원 최초 1품 접수 준비는 별도 항목입니다.</p>
${open.map(e=>`<button class="event" onclick="renderApplication('${e.id}')"><div class="row"><strong>${esc(e.name)}</strong><span>›</span></div><div class="muted">${esc(e.date||'일정 미등록')} · ${e.items.length}개 종목</div></button>`).join('')}
<button class="event" onclick="renderKukki()"><div class="row"><strong>국기원 최초 1품 접수 준비</strong><span>›</span></div><div class="muted">티콘 아이디 · 생년월일 · 키 · 몸무게</div></button>
${open.length?'':'<div class="notice">현재 모집 중인 대회가 없습니다. 관리자 화면에서 대회를 등록해 주세요.</div>'}</div>`}
function renderApplication(eid){const e=data.events.find(x=>x.id===eid);if(!e)return renderParent();let chosen=[];document.getElementById('parentView').innerHTML=`<div class="card"><button class="secondary small" onclick="renderParent()">← 신청 항목 선택</button><h2>${esc(e.name)}</h2><p class="muted">신청 정보를 입력해 주세요. 이 대회의 신청 내용은 다른 대회와 별도로 저장됩니다.</p>
<form id="appForm">
<div class="grid"><div class="field"><label>선수 이름 *</label><input name="name" required></div><div class="field"><label>생년월일 *</label><input name="birth" type="date" required></div>
<div class="field"><label>학교명 *</label><input name="school" required></div><div class="field"><label>학년 *</label><select name="grade" required><option value="">선택</option>${['유치부','초등학교 1학년','초등학교 2학년','초등학교 3학년','초등학교 4학년','초등학교 5학년','초등학교 6학년','중학생','고등학생','기타'].map(x=>`<option>${x}</option>`).join('')}</select></div>
<div class="field"><label>학부모 연락처 *</label><input name="phone" type="tel" required placeholder="010-0000-0000"></div></div>
<h3>참가 종목 선택 *</h3><div id="items">${e.items.map((it,i)=>`<label class="event"><div class="row"><span><input type="checkbox" name="item" value="${i}" onchange="updateTotal('${eid}')"> ${esc(it.name)}</span><strong>${won(it.fee)}</strong></div>${it.weight?'체급 선택 가능':''}<div id="weight${i}" class="field hidden"><label>체급</label><input name="weight${i}" placeholder="체급 입력"></div></label>`).join('')}</div>
<div class="field"><label>추가 요청사항</label><textarea name="memo" rows="2"></textarea></div>
<label class="checkline"><input type="checkbox" name="consent" required> 개인정보 수집·이용 안내를 확인하고 동의합니다. (실제 운영 전 동의문을 확정해야 합니다.)</label>
<div class="card"><div class="muted">참가비 합계</div><div id="total" class="total">0원</div></div>
<button type="submit" style="width:100%">신청서 제출 및 납부 안내</button></form></div>`;
e.items.forEach((it,i)=>{if(it.weight){const c=document.querySelector(`input[name=item][value="${i}"]`);c.addEventListener('change',()=>document.getElementById('weight'+i).classList.toggle('hidden',!c.checked))}});
document.getElementById('appForm').onsubmit=(ev)=>{ev.preventDefault();const f=new FormData(ev.target);const indexes=f.getAll('item').map(Number);if(!indexes.length)return alert('참가 종목을 선택해 주세요.');for(const i of indexes){if(e.items[i].weight&&!String(f.get('weight'+i)||'').trim())return alert('선택한 종목의 체급을 입력해 주세요.')}
const selected=indexes.map(i=>({name:e.items[i].name,fee:Number(e.items[i].fee),weight:f.get('weight'+i)||''}));const amount=selected.reduce((s,x)=>s+x.fee,0);const app={id:id(),type:'event',eventId:e.id,eventName:e.name,name:f.get('name').trim(),birth:f.get('birth'),school:f.get('school').trim(),grade:f.get('grade'),phone:f.get('phone').trim(),items:selected,amount,paid:false,status:'접수',memo:f.get('memo')||'',created:new Date().toISOString()};data.applications.push(app);save();renderReceipt(app)};
}
function updateTotal(eid){const e=data.events.find(x=>x.id===eid);const selected=[...document.querySelectorAll('input[name=item]:checked')].map(x=>Number(x.value));document.getElementById('total').textContent=won(selected.reduce((s,i)=>s+Number(e.items[i].fee),0))}
function renderReceipt(a){document.getElementById('parentView').innerHTML=`<div class="card" style="text-align:center"><div style="font-size:42px">✓</div><h2>신청이 접수되었습니다</h2><p class="muted">관리자가 입금을 확인하면 납부 상태가 변경됩니다.</p><hr><div class="row"><span>대회</span><strong>${esc(a.eventName)}</strong></div><div class="row" style="margin-top:12px"><span>선수</span><strong>${esc(a.name)}</strong></div><div class="row" style="margin-top:12px"><span>종목</span><strong>${esc(a.items.map(x=>x.name+(x.weight?'('+x.weight+')':'')).join(', '))}</strong></div><hr><div class="muted">납부할 금액</div><div class="total">${won(a.amount)}</div><div class="card" style="text-align:left"><h3>입금 계좌 안내</h3><p>${esc(data.settings.bank)}</p><p>${esc(data.settings.account)}</p><p>예금주: ${esc(data.settings.holder)}</p><p class="muted">입금자명은 선수 이름으로 부탁드립니다. 실제 안내 문구는 관리자가 조정할 수 있습니다.</p></div><button onclick="renderParent()" style="width:100%">다른 신청 항목 보기</button></div>`}
function renderKukki(){document.getElementById('parentView').innerHTML=`<div class="card"><button class="secondary small" onclick="renderParent()">← 신청 항목 선택</button><h2>국기원 최초 1품 접수 준비</h2><p class="muted">최초 1품 접수 준비에 필요한 정보를 입력해 주세요.</p><form id="kForm"><div class="field"><label>선수 이름 *</label><input name="name" required></div><div class="field"><label>생년월일 *</label><input name="birth" type="date" required></div><div class="field"><label>학부모 연락처 *</label><input name="phone" type="tel" required></div><div class="field"><label>티콘 아이디 *</label><input name="ticon" required></div><div class="grid"><div class="field"><label>키 (cm) *</label><input name="height" type="number" min="1" step="0.1" required></div><div class="field"><label>몸무게 (kg) *</label><input name="weight" type="number" min="1" step="0.1" required></div></div><label class="checkline"><input type="checkbox" name="consent" required> 국기원 접수 준비를 위한 개인정보 수집·이용 안내를 확인하고 동의합니다.</label><button style="width:100%">정보 제출</button></form></div>`;
document.getElementById('kForm').onsubmit=ev=>{ev.preventDefault();const f=new FormData(ev.target);data.applications.push({id:id(),type:'kukki',eventName:'국기원 최초 1품 접수 준비',name:f.get('name').trim(),birth:f.get('birth'),phone:f.get('phone').trim(),ticon:f.get('ticon').trim(),height:f.get('height'),weight:f.get('weight'),paid:null,status:'확인 필요',created:new Date().toISOString()});save();document.getElementById('parentView').innerHTML='<div class="card"><h2>정보가 접수되었습니다</h2><p>관리자가 정보를 확인할 예정입니다.</p><button onclick="renderParent()">신청 항목으로 돌아가기</button></div>'}}
function renderAdmin(){const el=document.getElementById('adminView');if(sessionStorage.getItem('tkdAdmin')!=='yes'){el.innerHTML=`<div class="card"><h2>관리자 로그인</h2><p class="muted">초기 관리자 비밀번호는 최초 실행 시 설정됩니다.</p><form id="login"><div class="field"><label>관리자 비밀번호</label><input type="password" name="pw" required autocomplete="current-password"></div><button style="width:100%">로그인</button></form><p class="muted">첫 실행 기본 비밀번호: <strong>dojo1234!</strong><br>첫 로그인 후 실제 운영 전 반드시 변경하세요.</p></div>`;document.getElementById('login').onsubmit=e=>{e.preventDefault();if(new FormData(e.target).get('pw')===(localStorage.getItem('tkdAdminPw')||'dojo1234!')){sessionStorage.setItem('tkdAdmin','yes');renderAdmin()}else alert('비밀번호가 올바르지 않습니다.')};return}
el.innerHTML=`<div class="row mobilecol"><div><h2>관리자 대시보드</h2><p class="muted">신청 내역과 참가비를 관리합니다.</p></div><button class="secondary" onclick="sessionStorage.removeItem('tkdAdmin');renderAdmin()">로그아웃</button></div>
<div class="stats"><div class="stat">전체 신청<strong>${data.applications.length}</strong></div><div class="stat">입금 대기<strong>${data.applications.filter(a=>a.type==='event'&&!a.paid).length}</strong></div><div class="stat">국기원 확인<strong>${data.applications.filter(a=>a.type==='kukki'&&a.status!=='확인 완료').length}</strong></div></div>
<div class="card"><h3>도장 및 계좌 설정</h3><form id="settingsForm"><div class="grid"><div class="field"><label>도장명</label><input name="dojo" value="${esc(data.settings.dojo)}"></div><div class="field"><label>은행명</label><input name="bank" value="${esc(data.settings.bank)}"></div><div class="field"><label>계좌번호</label><input name="account" value="${esc(data.settings.account)}"></div><div class="field"><label>예금주</label><input name="holder" value="${esc(data.settings.holder)}"></div></div><button>설정 저장</button></form></div>
<div class="card"><h3>대회 등록</h3><form id="eventForm"><div class="field"><label>대회명 *</label><input name="name" required></div><div class="field"><label>대회 날짜</label><input name="date" type="date"></div><div class="field"><label>종목 및 참가비 *</label><p class="muted">한 줄에 하나씩 입력: 종목명,금액,체급필요여부(true/false)</p><textarea name="items" rows="4" required placeholder="품새,30000,false&#10;겨루기,40000,true"></textarea></div><label class="checkline"><input type="checkbox" name="open" checked> 학부모에게 공개</label><button>대회 등록</button></form></div>
<div class="card"><div class="row mobilecol"><h3>신청 명단</h3><div><button class="small" onclick="exportCsv()">엑셀용 CSV 다운로드</button> <button class="small secondary" onclick="renderAdmin()">새로고침</button></div></div>
<div class="field"><label>대회/선수 검색</label><input id="searchApps" placeholder="대회명 또는 선수 이름"></div>
<div class="tablewrap"><table><thead><tr><th>접수일</th><th>구분/대회</th><th>선수</th><th>정보/종목</th><th>금액</th><th>상태</th><th>관리</th></tr></thead><tbody id="appsRows"></tbody></table></div></div>
<div class="card"><h3>관리자 비밀번호 변경</h3><form id="pwForm"><div class="field"><label>새 비밀번호 (12자 이상 권장)</label><input name="pw" type="password" minlength="10" required></div><button class="secondary">비밀번호 변경</button></form></div>
<div class="card"><h3>데이터 백업</h3><button class="secondary" onclick="backup()">JSON 백업 파일 다운로드</button> <button class="danger" onclick="if(confirm('이 브라우저의 모든 앱 데이터를 삭제할까요?')){data=structuredClone(defaultData);save();renderAdmin()}">모든 데이터 삭제</button><p class="muted">브라우저 데이터 삭제 시 자료가 사라질 수 있습니다. 정기적으로 백업하세요.</p></div>`;
document.getElementById('settingsForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);data.settings={dojo:f.get('dojo'),bank:f.get('bank'),account:f.get('account'),holder:f.get('holder')};save();alert('설정을 저장했습니다.');renderAdmin()};
document.getElementById('eventForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);let items;try{items=f.get('items').split('\n').filter(x=>x.trim()).map(line=>{const p=line.split(',').map(x=>x.trim());if(p.length<2||!p[0]||!Number.isFinite(Number(p[1]))||Number(p[1])<0)throw Error('종목,금액 형식을 확인하세요.');return {name:p[0],fee:Number(p[1]),weight:(p[2]||'false').toLowerCase()==='true'}})}catch(err){alert(err.message||'종목 입력을 확인하세요.');return}data.events.push({id:id(),name:f.get('name').trim(),date:f.get('date'),items,open:f.get('open')==='on'});save();alert('대회를 등록했습니다.');renderAdmin()};
document.getElementById('pwForm').onsubmit=e=>{e.preventDefault();localStorage.setItem('tkdAdminPw',new FormData(e.target).get('pw'));alert('이 브라우저의 관리자 비밀번호를 변경했습니다.');e.target.reset()};
document.getElementById('searchApps').oninput=drawRows;drawRows()}
function drawRows(){const body=document.getElementById('appsRows');if(!body)return;const q=(document.getElementById('searchApps')?.value||'').toLowerCase();const rows=data.applications.filter(a=>(a.name+' '+a.eventName).toLowerCase().includes(q));body.innerHTML=rows.map(a=>`<tr><td>${new Date(a.created).toLocaleDateString('ko-KR')}</td><td>${a.type==='kukki'?'국기원':esc(a.eventName)}</td><td>${esc(a.name)}<br><span class="muted">${esc(a.phone)}</span></td><td>${a.type==='kukki'?`티콘: ${esc(a.ticon)}<br>생년월일: ${esc(a.birth)}<br>키 ${esc(a.height)}cm / ${esc(a.weight)}kg`:`${esc(a.items.map(x=>x.name+(x.weight?'('+x.weight+')':'')).join(', '))}<br>${esc(a.school)} ${esc(a.grade)}`}</td><td>${a.type==='kukki'?'-':won(a.amount)}</td><td><span class="pill ${a.paid||a.status==='확인 완료'?'green':'orange'}">${a.type==='event'?(a.paid?'입금 완료':'입금 대기'):esc(a.status)}</span></td><td>${a.type==='event'?`<button class="small ${a.paid?'secondary':''}" onclick="togglePaid('${a.id}')">${a.paid?'미납 처리':'입금 확인'}</button>`:`<button class="small" onclick="markKukki('${a.id}')">확인 완료</button>`} <button class="small danger" onclick="removeApp('${a.id}')">삭제</button></td></tr>`).join('')||'<tr><td colspan="7">신청 내역이 없습니다.</td></tr>'}
function togglePaid(aid){const a=data.applications.find(x=>x.id===aid);if(a){a.paid=!a.paid;save();drawRows()}}
function markKukki(aid){const a=data.applications.find(x=>x.id===aid);if(a){a.status=a.status==='확인 완료'?'확인 필요':'확인 완료';save();drawRows()}}
function removeApp(aid){if(confirm('이 신청 기록을 삭제할까요?')){data.applications=data.applications.filter(x=>x.id!==aid);save();drawRows()}}
function exportCsv(){const rows=[['접수일','구분','대회','선수','생년월일','학교','학년','연락처','종목','체급','참가비','납부상태','티콘아이디','키cm','몸무게kg','상태']];data.applications.forEach(a=>{if(a.type==='kukki')rows.push([a.created,'국기원',a.eventName,a.name,a.birth,'','',''+a.phone,'','','','',''+a.ticon,a.height,a.weight,a.status]);else rows.push([a.created,'대회',a.eventName,a.name,a.birth,a.school,a.grade,a.phone,a.items.map(x=>x.name).join('|'),a.items.map(x=>x.weight).join('|'),a.amount,a.paid?'입금 완료':'입금 대기','','','',a.status])});const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(csv,'taekwondo-applications.csv','text/csv;charset=utf-8')}
function backup(){download(JSON.stringify(data,null,2),'taekwondo-backup.json','application/json')}
function download(content,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
renderParent();
</script></body></html>
