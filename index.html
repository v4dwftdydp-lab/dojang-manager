<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>흑룡태권도레저스쿨</title>

<style>
:root {
  --navy: #173451;
  --blue: #2563eb;
  --bg: #ffffff;
  --line: #dbe3ed;
  --muted: #64748b;
  --gold: #d8b46a;
  --parent-bg: #e7eef8;
  --parent-text: #17365d;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #ffffff;
  font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
  color: #172033;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
  border: 0;
  border-radius: 10px;
  padding: 11px 14px;
  font-weight: 700;
  transition: 0.2s ease;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

button:hover {
  filter: brightness(0.97);
}

.wrap {
  max-width: 980px;
  margin: auto;
  padding: 16px;
}

/* 상단 로고 영역 */
.hero {
  background: linear-gradient(135deg, #111111, #292929);
  color: #ffffff;
  border: 1px solid #8f7138;
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 16px;
}

.hero h1 {
  margin: 8px 0;
  font-size: 32px;
  color: #ffffff;
}

.hero p {
  margin: 0;
  color: #e5e5e5;
  line-height: 1.6;
}

/* 상단 메뉴 */
.nav {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 14px 0;
  padding: 18px;
  flex-wrap: wrap;
  background: #171717;
  border-radius: 20px;
}

/* 학부모 신청 버튼만 연한 회청색 */
#navParent {
  background: #e7eef8;
  color: #17365d;
  border: 1px solid #e7eef8;
}

/* 관리자 버튼은 기존대로 배경 없이 흰 글씨 */
#navAdmin {
  background: transparent;
  color: #ffffff;
  border: 1px solid transparent;
}

/* 메뉴 활성화 시에도 색상 유지 */
#navParent.active {
  background: #e7eef8;
  color: #17365d;
  border-color: #e7eef8;
}

#navAdmin.active {
  background: transparent;
  color: #ffffff;
  border-color: transparent;
}

/* 공통 카드 */
.card {
  background: #ffffff;
  color: #172033;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  margin: 12px 0;
}

.card h2,
.card h3 {
  color: #111111;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 10px 0;
}

.field label {
  font-size: 14px;
  font-weight: 700;
  color: #111111;
}

.field input,
.field select,
.field textarea,
input,
select,
textarea {
  max-width: 100%;
  border: 1px solid #bdbdbd;
  border-radius: 9px;
  padding: 11px;
  background: #f2f2f2;
  color: #111111;
}

input::placeholder,
textarea::placeholder {
  color: #666666;
}

input:focus,
select:focus,
textarea:focus {
  outline: 2px solid #b6c8df;
  outline-offset: 1px;
}

.muted {
  color: var(--muted);
  font-size: 13px;
}

.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.hidden {
  display: none !important;
}

/* 대회 항목 */
.event {
  display: block;
  width: 100%;
  margin: 9px 0;
  padding: 13px;
  text-align: left;
  background: #ffffff;
  color: #172033;
  border: 1px solid var(--line);
  border-radius: 12px;
}

.event strong {
  color: #111111;
}

.event .muted {
  margin-top: 5px;
}

/* 보조 버튼 */
button.secondary {
  background: #e8eef6;
  color: #173451;
}

button.danger {
  background: #fee2e2;
  color: #991b1b;
}

/* 제출 버튼 */
button[type="submit"],
#sf button,
#ef button {
  background: var(--gold);
  color: #111111;
  font-weight: 700;
}

/* 관리자 화면 */
#adminView {
  color: #111111;
}

#adminView h1,
#adminView h2,
#adminView h3,
#adminView label,
#adminView p,
#adminView .muted,
#adminView .event strong {
  color: #111111;
}

#adminView input,
#adminView select,
#adminView textarea {
  background: #f2f2f2;
  color: #111111;
  border-color: #bdbdbd;
}

#adminView input::placeholder,
#adminView textarea::placeholder {
  color: #666666;
}

/* 합계 */
.total {
  font-size: 25px;
  font-weight: 800;
  color: var(--navy);
}

/* 동의 항목 */
.checkline {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  margin: 12px 0;
  font-size: 14px;
}

.checkline input {
  margin-top: 4px;
}

/* 표 */
.tablewrap {
  overflow-x: auto;
}

table {
  border-collapse: collapse;
  width: 100%;
  font-size: 13px;
}

th,
td {
  padding: 9px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
}

th {
  background: #f8fafc;
}

.pill {
  display: inline-block;
  border-radius: 99px;
  padding: 4px 8px;
  background: #e8eef6;
  font-size: 12px;
}

.green {
  background: #dcfce7;
  color: #166534;
}

.orange {
  background: #ffedd5;
  color: #9a3412;
}

/* 안내 메시지 */
.notice {
  padding: 12px;
  border-radius: 10px;
  background: #eff6ff;
  color: #1e40af;
  font-size: 13px;
}

.footer {
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  padding: 20px;
}

/* 모바일 */
@media (max-width: 600px) {
  .wrap {
    padding: 10px;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  .hero h1 {
    font-size: 21px;
  }

  .hero {
    padding: 16px;
  }

  .hero img {
    width: 76px !important;
    height: 76px !important;
  }

  .nav {
    padding: 14px;
  }

  .row.mobile {
    align-items: flex-start;
    flex-direction: column;
  }
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
<main class="wrap">

<header class="hero">
  <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
    <img
      src="https://udertixrubzikutffddx.supabase.co/storage/v1/object/public/event-images/black-dragon-logo.png.png"
      alt="흑룡태권도 로고"
      style="width:100px;height:100px;object-fit:contain;background:white;border-radius:10px;padding:5px"
    >
    <div>
      <div style="font-size:14px;letter-spacing:2px;color:#d8b46a">
        BLACK DRAGON TAEKWONDO
      </div>
      <h1 id="dojoTitle">흑룡태권도레저스쿨</h1>
      <p>흑룡태권도 대회 접수 · 국기원 TCON ID 등록</p>
    </div>
  </div>
</header>

<div id="topmsg" class="notice hidden"></div>

<div class="nav">
  <button id="navParent" class="active" onclick="showView('parent')">
    학부모 신청
  </button>
  <button id="navAdmin" onclick="showView('admin')">
    관리자
  </button>
</div>

<section id="parentView"></section>
<section id="adminView" class="hidden"></section>

<div class="footer">
  개인정보는 Supabase에 저장되며 관리자 계정으로만 전체 명단을 확인할 수 있습니다.
</div>

</main>

<script>
const SUPABASE_URL = 'https://udertixrubzikutffddx.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_BOnSQd3weZio23P0aapELw_aPrCJfdh';

const $ = id => document.getElementById(id);

let sb = null;
let currentUser = null;

let settings = {
  dojo_name: '흑룡태권도',
  bank_name: '은행명 입력',
  account_number: '계좌번호 입력',
  account_holder: '예금주 입력'
};

let events = [];

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[c]));
}

function won(n) {
  return Number(n || 0).toLocaleString('ko-KR') + '원';
}

function notice(s) {
  $('topmsg').textContent = s;
  $('topmsg').classList.remove('hidden');
}

function clearNotice() {
  $('topmsg').classList.add('hidden');
}

function init() {
  if (!window.supabase) {
    notice('연결 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.');
    return;
  }

  sb = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  renderParent();
}

function showView(v) {
  $('parentView').classList.toggle('hidden', v !== 'parent');
  $('adminView').classList.toggle('hidden', v !== 'admin');

  $('navParent').classList.toggle('active', v === 'parent');
  $('navAdmin').classList.toggle('active', v === 'admin');

  if (v === 'parent') {
    renderParent();
  } else {
    renderAdmin();
  }
}

async function getSettings() {
  const { data, error } = await sb
    .from('settings')
    .select('*')
    .eq('id', 1)
    .maybeSingle();

  if (!error && data) {
    settings = data;
    $('dojoTitle').textContent =
      data.dojo_name || '흑룡태권도레저스쿨';
  }
}

async function renderParent() {
  if (!sb) return;

  clearNotice();
  await getSettings();

  const { data, error } = await sb
    .from('events')
    .select('id,name,event_date,location,description,categories,is_open,image_url')
    .eq('is_open', true)
    .order('event_date', { ascending: true });

  if (error) {
    $('parentView').innerHTML = `
      <div class="card">
        <h2>신청 화면을 불러오지 못했습니다</h2>
        <p>${esc(error.message)}</p>
        <button onclick="renderParent()">다시 시도</button>
      </div>`;
    return;
  }

  events = data || [];

  $('parentView').innerHTML = `
    <div class="card">
      <h2>참가 신청 항목</h2>
      <p class="muted">
        참가할 대회를 선택하고 대회별 신청서를 각각 작성해 주세요.
      </p>

      ${events.map(e => `
        <button class="event" onclick="renderApplication('${e.id}')">
          <div class="row">
            <strong>${esc(e.name)}</strong>
            <span>›</span>
          </div>
          <div class="muted">
            ${esc(e.event_date || '일정 미등록')} · ${esc(e.location || '')}
          </div>
          ${e.image_url ? `
            <img
              src="${esc(e.image_url)}"
              alt="대회 안내 이미지"
              style="width:100%;max-height:320px;object-fit:contain;margin-top:10px;border-radius:8px"
            >
          ` : ''}
        </button>
      `).join('')}

      ${events.length ? '' : `
        <div class="notice">현재 모집 중인 대회가 없습니다.</div>
      `}

      <button class="event" onclick="renderKukki()">
        <strong>국기원 TCON ID 등록</strong>
        <div class="muted">
          티콘 사이트에서 회원가입할 때 작성했던 내용을 입력해 주세요.
        </div>
      </button>
    </div>`;
}

function renderApplication(eid) {
  const e = events.find(x => x.id === eid);

  if (!e) return renderParent();

  const cats = Array.isArray(e.categories) ? e.categories : [];

  $('parentView').innerHTML = `
    <div class="card">
      <button class="secondary" onclick="renderParent()">← 신청 항목</button>
      <h2>${esc(e.name)}</h2>

      <form id="appForm">
        <div class="grid">
          <div class="field">
            <label>선수 이름 *</label>
            <input name="name" required>
          </div>

          <div class="field">
            <label>생년월일 *</label>
            <input name="birth" type="date" required>
          </div>

          <div class="field">
            <label>학교명 *</label>
            <input name="school" required>
          </div>

          <div class="field">
            <label>학년 *</label>
            <select name="grade" required>
              <option value="">선택</option>
              ${[
                '유치부',
                '초등학교 1학년',
                '초등학교 2학년',
                '초등학교 3학년',
                '초등학교 4학년',
                '초등학교 5학년',
                '초등학교 6학년',
                '중학생',
                '고등학생',
                '기타'
              ].map(x => `<option>${x}</option>`).join('')}
            </select>
          </div>

          <div class="field">
            <label>학부모 연락처 *</label>
            <input name="phone" type="tel" required placeholder="010-0000-0000">
          </div>
        </div>

        <h3>참가 종목 *</h3>

        ${cats.map((c, i) => `
          <label class="event">
            <span>
              <input type="checkbox" name="cat" value="${i}">
              ${esc(c.name)}
            </span>
            <strong>${won(c.fee)}</strong>

            ${c.weight ? `
              <div class="field">
                <label>체급</label>
                <input name="weight${i}" placeholder="체급 입력">
              </div>
            ` : ''}
          </label>
        `).join('')}

        <div class="field">
          <label>추가 요청사항</label>
          <textarea name="memo" rows="2"></textarea>
        </div>

        <label class="checkline">
          <input type="checkbox" name="consent" required>
          개인정보 수집·이용에 동의합니다.
        </label>

        <div class="card">
          <div class="muted">참가비 합계</div>
          <div id="total" class="total">0원</div>
        </div>

        <button type="submit" style="width:100%">
          신청 및 입금 안내
        </button>
      </form>
    </div>`;

  const form = $('appForm');

  function recalc() {
    const ix = [...form.querySelectorAll('input[name=cat]:checked')]
      .map(x => Number(x.value));

    $('total').textContent =
      won(ix.reduce((s, i) => s + (Number(cats[i].fee) || 0), 0));
  }

  form.querySelectorAll('input[name=cat]').forEach(x => {
    x.addEventListener('change', recalc);
  });

  form.onsubmit = async ev => {
    ev.preventDefault();

    const f = new FormData(form);
    const ix = f.getAll('cat').map(Number);

    if (!ix.length) {
      alert('참가 종목을 선택해 주세요.');
      return;
    }

    const selected = ix.map(i => ({
      name: cats[i].name,
      fee: Number(cats[i].fee || 0),
      weight: cats[i].weight ? (f.get('weight' + i) || '') : ''
    }));

    const amount = selected.reduce((s, c) => s + c.fee, 0);

    const row = {
      event_id: e.id,
      athlete_name: String(f.get('name')).trim(),
      birth_date: f.get('birth'),
      school: String(f.get('school')).trim(),
      grade: f.get('grade'),
      parent_phone: String(f.get('phone')).trim(),
      selected_categories: selected,
      total_fee: amount,
      notes: String(f.get('memo') || ''),
      consent: true,
      paid: false
    };

    const b = form.querySelector('button[type="submit"]');
    b.disabled = true;

    const { error } = await sb.from('applications').insert(row);

    b.disabled = false;

    if (error) {
      alert('신청 저장 실패: ' + error.message);
      return;
    }

    receipt(e, row, selected, amount);
  };
}

function receipt(e, a, selected, amount) {
  $('parentView').innerHTML = `
    <div class="card">
      <h2>신청이 접수되었습니다</h2>
      <p>입금 확인 후 관리자가 납부 상태를 변경합니다.</p>
      <hr>

      <p>대회: <strong>${esc(e.name)}</strong></p>
      <p>선수: <strong>${esc(a.athlete_name)}</strong></p>
      <p>종목: ${esc(selected.map(x =>
        x.name + (x.weight ? '(' + x.weight + ')' : '')
      ).join(', '))}</p>

      <p class="muted">납부 금액</p>
      <div class="total">${won(amount)}</div>

      <div class="card">
        <h3>입금 계좌</h3>
        <p>${esc(settings.bank_name || '은행명 입력')}</p>
        <p>${esc(settings.account_number || '계좌번호 입력')}</p>
        <p>예금주: ${esc(settings.account_holder || '예금주 입력')}</p>
        <p class="muted">입금자명은 선수 이름으로 보내주세요.</p>
      </div>

      <button onclick="renderParent()">다른 신청 항목 보기</button>
    </div>`;
}

function renderKukki() {
  $('parentView').innerHTML = `
    <div class="card">
      <button class="secondary" onclick="renderParent()">← 신청 항목</button>
      <h2>국기원 TCON ID 등록</h2>

      <form id="kf">
        <div class="grid">
          <div class="field">
            <label>선수 이름 *</label>
            <input name="name" required>
          </div>

          <div class="field">
            <label>티콘 아이디 *</label>
            <input name="tcon" required>
          </div>

          <div class="field">
            <label>생년월일 *</label>
            <input name="birth" type="date" required>
          </div>

          <div class="field">
            <label>학부모 연락처 *</label>
            <input name="phone" required>
          </div>

          <div class="field">
            <label>키 (cm) *</label>
            <input name="height" type="number" min="1" step="0.1" required>
          </div>

          <div class="field">
            <label>몸무게 (kg) *</label>
            <input name="weight" type="number" min="1" step="0.1" required>
          </div>
        </div>

        <label class="checkline">
          <input name="consent" type="checkbox" required>
          접수 준비를 위한 개인정보 수집·이용에 동의합니다.
        </label>

        <button type="submit" style="width:100%">정보 제출</button>
      </form>
    </div>`;

  $('kf').onsubmit = async ev => {
    ev.preventDefault();

    const
